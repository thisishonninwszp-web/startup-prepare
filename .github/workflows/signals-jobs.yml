name: signals-jobs
on:
  workflow_dispatch:
    inputs:
      business_only:
        description: Isolated withdrawal selection smoke only
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trial withdrawal selection only
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://startup-prepare.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is missing"; exit 1; fi
          code=$(curl --silent --show-error --max-time 60 --output withdrawal-trial.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/business-withdrawals?invocation=authorized-smoke-$GITHUB_RUN_ID")
          cat withdrawal-trial.json
          if [ "$code" != "200" ]; then echo "Unexpected HTTP status: $code"; exit 1; fi
          jq -e '.collection.status == "disabled"' withdrawal-trial.json
