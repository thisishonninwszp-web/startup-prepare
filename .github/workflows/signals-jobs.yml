# 外部信号的后台活（算新闻的指纹、预测题进账本、AI 押题、到期对账）。
# Vercel 免费版一次只能跑 60 秒、只有两个定时任务，量大的活放在这里：
# 这里不跑项目代码，只按顺序一次次调线上的 /api/cron/jobs/<step>，每次一分钟以内，没做完就再调。
# 只需要一个仓库 Secret：CRON_SECRET（和 Vercel 里的同一个值）。
name: signals-jobs

on:
  schedule:
    - cron: "30 22 * * *" # 日本时间 7:30（早上的报告出来以后）
    - cron: "0 10 * * *" # 日本时间 19:00
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run steps
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://startup-prepare.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "没配 CRON_SECRET，跳过"; exit 0; fi
          call() {
            curl -sS --max-time 75 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/jobs/$1" || echo '{"done":true,"note":"没连上"}'
          }
          for step in embed resolve markets business forecast; do
            for i in $(seq 1 15); do
              out=$(call "$step")
              echo "$step #$i $out"
              echo "$out" | grep -q '"done":true' && break
            done
          done
